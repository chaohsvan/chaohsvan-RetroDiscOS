# RetroDisc OS 按键映射
# 语法: 动作 = 按键名
# 动作名固定（见 src/core/config.cpp），按键名为 evdev 键名的大写形式
# 改这里不需要重新编译（D3：纯键盘，无鼠标）

# --- 播放控制 ---
play_pause      = SPACE
next            = RIGHT
prev            = LEFT
seek_back       = F11
seek_fwd        = F12
stop            = X

# --- 音量 ---
vol_up          = UP
vol_down        = DOWN
mute            = F10

# --- 播放模式 ---
mode            = F1
random          = F2
repeat          = F3

# --- 显示 ---
info            = F4
theme           = F5
brightness_down = F6
brightness_up   = F7
display_toggle  = F8
spectrum        = F9

# --- 光驱与系统 ---
eject           = E
help            = H
service         = S
quit            = Q
