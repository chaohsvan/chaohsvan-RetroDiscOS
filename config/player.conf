# RetroDisc OS 播放器配置
# 语法: key = value   以 # 开头的行为注释
# 程序只内置默认值，所有可调项以本文件为准（AGENTS.md 5.5）

# 音频输出设备。"null" 表示丢弃（无硬件测试用），真机填 ALSA 设备名如 "default"
audio_device = null

# 初始音量，0.0 ~ 1.0。这是软件音量，不保证 Bit-Perfect（见 docs/decisions.md D2）
volume = 0.8

# 初始显示主题: digital-hifi / classic-vfd / amber / vintage-analog / off
theme = digital-hifi

# 断点续播文件；留空表示不保存播放位置
resume_file = ~/.local/state/retrodisc/resume.json
