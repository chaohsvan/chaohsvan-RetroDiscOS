# Installed as /etc/systemd/journald.conf.d/retrodisc.conf
# The player is a dedicated appliance: keep logs long enough to diagnose a
# crash, short enough to stop the SSD from being written forever (PRD 3.4).
[Journal]
Storage=persistent
SystemMaxUse=64M
SystemMaxFileSize=8M
RuntimeMaxUse=32M
MaxRetentionSec=1week
# Fewer fsyncs per minute than the 1s default.
SyncIntervalSec=5m
