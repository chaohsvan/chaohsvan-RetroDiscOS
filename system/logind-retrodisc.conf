# Installed as /etc/systemd/logind.conf.d/retrodisc.conf
#
# The player handles a short power-key press itself (blank / wake the display).
# Without this, logind powers the machine off before the player sees the key.
#
# This does NOT weaken a real long hold: a several-second hold is handled by the
# EC/firmware and forces a hard power-off regardless of the OS.
[Login]
HandlePowerKey=ignore
HandleSuspendKey=ignore
